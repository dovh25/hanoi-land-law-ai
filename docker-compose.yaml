services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:////app/data/law.db
      LLM_USAGE_DB: /app/data/llm-usage.sqlite3
      DOCS_ROOT: /app/law_crawler/vbpl_documents
      QDRANT_HOST: qdrant
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - backend-data:/app/data
      - ./law_crawler:/app/law_crawler:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3

  qdrant:
    image: qdrant/qdrant:v1.16.2
    profiles: [retrieval]
    # Internal network only; no unauthenticated host/dashboard exposure.
    volumes:
      - qdrant-data:/qdrant/storage

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      # Pass only public configuration, never the backend env_file.
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://127.0.0.1:8000}
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules

volumes:
  backend-data:
  qdrant-data:
