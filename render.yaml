# Render Blueprint for the public, anonymous MVP demo.
#
# This file does not deploy anything by itself. It is only read after the repository
# has a remote, the working tree has been committed/pushed with approval, and a Render
# Blueprint is created for that repository. See docs/deployment.md.
#
# The demo is deliberately offline-capable: retrieval is lexical BM25 over a bundled
# JSONL artifact, with no Qdrant, embeddings, model downloads, or database persistence.
# Production Gemini activation was explicitly approved on 2026-10-27.
# Keep its API key in Render's secret environment, never in this file.
services:
  - type: web
    name: hanoi-land-law-ai-demo
    runtime: python
    plan: free
    region: singapore
    branch: main
    autoDeploy: false
    healthCheckPath: /demo/readyz
    buildCommand: pip install --upgrade uv && uv sync --frozen --no-dev
    startCommand: uv run --frozen --no-dev uvicorn backend.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: APP_MODE
        value: production
      - key: LOG_LEVEL
        value: INFO
      # Generated by Render; the app rejects short or placeholder secrets.
      - key: JWT_SECRET_KEY
        generateValue: true
      # Set to the exact deployed frontend origin at Blueprint creation, for example
      # ["https://hanoi-land-law-demo.pages.dev"] (no trailing slash, no "*").
      - key: CORS_ORIGINS
        sync: false

      # Retrieval and demo surface (no Qdrant, no embeddings, no model downloads).
      - key: MVP_ENABLED
        value: "true"
      - key: MVP_TOP_K
        value: "6"
      - key: MVP_MIN_SCORE
        value: "5.0"
      - key: MVP_MIN_COVERAGE
        value: "0.5"
      - key: MVP_RATE_LIMIT_PER_MINUTE
        value: "6"
      - key: MVP_RATE_LIMIT_PER_DAY
        value: "60"
      - key: MVP_MAX_MESSAGE_CHARS
        value: "1000"
      - key: MVP_MAX_HISTORY_MESSAGES
        value: "6"
      - key: MVP_MAX_HISTORY_CHARS
        value: "4000"
      - key: ALLOW_MODEL_DOWNLOADS
        value: "false"
      - key: ALLOW_REMOTE_MODEL_CODE
        value: "false"

      # Approved production activation; requires an existing valid GEMINI_API_KEY
      # dashboard secret. Local .env.example remains retrieval-only by default.
      - key: ENABLE_LIVE_LLM
        value: "true"
      - key: MODEL
        value: gemini-3.5-flash-lite
      # Application hard cap, not a claim about Google's Free Tier quota.
      - key: MAX_LLM_CALLS_PER_TURN
        value: "1"
      - key: MAX_LLM_CALLS_PER_DAY
        value: "8"
      - key: MAX_LLM_OUTPUT_TOKENS
        value: "1024"
      - key: LLM_REQUEST_TIMEOUT_SECONDS
        value: "20"
      - key: LLM_MAX_RETRIES
        value: "0"
