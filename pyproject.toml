[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "hanoi-land-law-ai"
version = "0.1.0"
description = "Local-first Hanoi land-law QA, adapted from ViLeXa"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.127.0",
    "uvicorn==0.40.0",
    "httpx==0.28.1",
    "sqlalchemy==2.0.46",
    "alembic==1.18.1",
    "numpy==2.4.1",
    "beautifulsoup4==4.14.3",
    "pypdf==6.6.0",
    "pdfminer.six==20251230",
    "python-docx==1.2.0",
    "pydantic-settings==2.12.0",
    "python-dotenv==1.2.1",
    "python-jose[cryptography]==3.5.0",
    "bcrypt==5.0.0",
    "langchain-core==1.2.7",
    "langsmith==0.6.4",
    "langgraph==1.0.6",
    "google-genai==1.56.0",
    "qdrant-client==1.16.2",
    "tqdm==4.67.1",
]

[project.optional-dependencies]
tokenizer = [
    "transformers==4.57.3", "sentencepiece==0.2.1",
]
ml = [
    "torch==2.9.1", "transformers==4.57.3",
    "sentence-transformers==5.2.0", "FlagEmbedding==1.3.5",
    "langchain-qdrant==1.1.0", "langchain-text-splitters==1.1.0",
]
crawl = ["requests==2.32.5", "beautifulsoup4==4.14.3"]
eval = ["deepeval==3.8.0", "tiktoken==0.12.0"]

[dependency-groups]
dev = ["pytest==9.0.2", "pytest-socket==0.7.0", "nbformat==5.10.4"]

[tool.hatch.build.targets.wheel]
packages = ["backend", "benchmarks", "preprocess", "law_crawler", "batch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--disable-socket --allow-unix-socket"

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
